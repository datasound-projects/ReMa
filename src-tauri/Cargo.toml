[package]
name = "rema"
version = "0.1.0"
description = "ReMa — Career UI Harness"
edition = "2021"
rust-version = "1.88"
publish = false

# The application core is a library so it can be unit-tested and, later,
# reused by other front-ends (e.g. a CLI or an LLM tool server) without the
# desktop shell. `main.rs` is only the desktop entry point.
[lib]
name = "rema_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads connectors.toml (ReMa's public OAuth client configuration).
toml = "1"

[dependencies]
# Public OAuth client configuration a development build reads at run time.
toml = "1"
# `unstable`: child webviews for the built-in browser workspace.
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2"
# Native file pickers, used from Rust only (no frontend permission).
tauri-plugin-dialog = "2"
# OS notifications for important application and interview changes.
tauri-plugin-notification = "2"
# Optional "Start ReMa at login" (off unless the user turns it on).
tauri-plugin-autostart = "2"
# A second launch (e.g. while ReMa runs in the tray) shows the running app
# instead of starting another instance that would sync the same mailboxes.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# IPC bindings (release candidates: keep versions pinned exactly).
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
# Persistence
rusqlite = { version = "0.40", features = ["bundled"] }
# LLM providers (HTTP + streaming)
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "query", "form", "stream", "system-proxy"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "io-util", "io-std", "process"] }
tokio-util = "0.7"
# Scheduling (timezone-aware date math)
jiff = "0.2"
# Secure credential storage (macOS Keychain, Windows Credential Manager, Secret Service)
keyring = "4"
# Google OAuth (PKCE) and API payloads
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
# Profile documents: text extraction from PDF and DOCX
pdf-extract = "0.12"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
# Job analytics: deterministic text patterns (salaries, dates, requirements)
regex = "1"
# Pages in legacy encodings (ISO-8859-1, Windows-1252) read correctly.
encoding_rs = "0.8"
# MCP (Model Context Protocol) client: the official Rust SDK. Local servers
# over stdio, remote servers over Streamable HTTP, and MCP OAuth.
rmcp = { version = "3.4", default-features = false, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "auth",
] }
# Local MCP servers run in their own process group (job object on Windows),
# so stopping one also stops the programs it started (npx → node).
process-wrap = { version = "10", features = ["tokio1"] }
# JSON Schemas for ReMa MCP's tool inputs and outputs (rmcp's schemars).
schemars = "1"
# Implementing rmcp's OAuth credential store (keychain-backed).
async-trait = "0.1"

# Linux: the browser workspace is layered over the app with a GTK overlay.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
# Opens the system browser in the interactive live sign-in tests.
open = "5"

# Small, fast release binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
