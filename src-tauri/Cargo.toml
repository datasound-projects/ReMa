[package]
name = "rema"
version = "0.1.0"
description = "ReMa — Career UI Harness"
edition = "2021"
rust-version = "1.77.2"
publish = false

# The application core is a library so it can be unit-tested and, later,
# reused by other front-ends (e.g. a CLI or an LLM tool server) without the
# desktop shell. `main.rs` is only the desktop entry point.
[lib]
name = "rema_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"

[dev-dependencies]
serde_json = "1"

# Small, fast release binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
