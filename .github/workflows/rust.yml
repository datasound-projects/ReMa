name: Rust

on:
  push:
    branches: [ "claude/rema-foundation-setup-6gmim3" ]
  pull_request:
    branches: [ "claude/rema-foundation-setup-6gmim3" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
