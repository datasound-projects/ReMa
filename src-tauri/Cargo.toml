[package]
name = "rema"
version = "0.1.0"
description = "ReMa — Career UI Harness"
edition = "2021"
rust-version = "1.88"
publish = false

# The application core is a library so it can be unit-tested and, later,
# reused by other front-ends (e.g. a CLI or an LLM tool server) without the
# desktop shell. `main.rs` is only the desktop entry point.
[lib]
name = "rema_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable`: child webviews for the built-in browser workspace.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
# Native file pickers, used from Rust only (no frontend permission).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# IPC bindings (release candidates: keep versions pinned exactly).
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
# Persistence
rusqlite = { version = "0.40", features = ["bundled"] }
# LLM providers (HTTP + streaming)
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "query", "form", "stream", "system-proxy"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "io-util"] }
tokio-util = "0.7"
# Scheduling (timezone-aware date math)
jiff = "0.2"
# Secure credential storage (macOS Keychain, Windows Credential Manager, Secret Service)
keyring = "4"
# Google OAuth (PKCE) and API payloads
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
# Profile documents: text extraction from PDF and DOCX
pdf-extract = "0.12"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.38"

# Linux: the browser workspace is layered over the app with a GTK overlay.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

# Small, fast release binaries.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
