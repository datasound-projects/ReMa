<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Soft ambient drop shadow under the icon tile -->
    <filter id="tile-ambient-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="30" stdDeviation="36" flood-color="#010614" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#00040d" flood-opacity="0.4" />
    </filter>

    <!-- 3D elevation shadow for the floating white R and dot -->
    <filter id="glyph-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#010e2b" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000614" flood-opacity="0.5" />
    </filter>

    <!-- 3D tile bottom extrusion lip -->
    <linearGradient id="extrusion-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#072d73" />
      <stop offset="60%" stop-color="#031842" />
      <stop offset="100%" stop-color="#010714" />
    </linearGradient>

    <!-- Rich 3D blue gradient surface: light angle top-left to bottom-right -->
    <linearGradient id="surface-blue" x1="0.12" y1="0.08" x2="0.88" y2="0.92">
      <stop offset="0%" stop-color="#3ca2ff" />
      <stop offset="18%" stop-color="#1f81ff" />
      <stop offset="45%" stop-color="#0d5fe6" />
      <stop offset="75%" stop-color="#063fa8" />
      <stop offset="100%" stop-color="#032066" />
    </linearGradient>

    <!-- Deep dark edges vignette -->
    <radialGradient id="dark-edges-vignette" cx="46%" cy="40%" r="66%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.02" />
      <stop offset="80%" stop-color="#02143d" stop-opacity="0.5" />
      <stop offset="95%" stop-color="#010a24" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#00040f" stop-opacity="0.94" />
    </radialGradient>

    <!-- Apple-style diagonal light angle sheen -->
    <linearGradient id="light-angle-sheen" x1="0.05" y1="0.05" x2="0.75" y2="0.75">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.36" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- Top-left light strike radial highlight -->
    <radialGradient id="light-strike" cx="30%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#60b5ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d5fe6" stop-opacity="0" />
    </radialGradient>

    <!-- Curved Apple glass gloss reflection overlay -->
    <linearGradient id="glass-specular" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Bevel border stroke (light rim at top-left, dark rim at bottom-right) -->
    <linearGradient id="bevel-stroke" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#9bd0ff" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#0d4bb8" stop-opacity="0.5" />
      <stop offset="90%" stop-color="#03163b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#000714" stop-opacity="0.95" />
    </linearGradient>

    <!-- Floating white R & dot gradient -->
    <linearGradient id="white-glyph" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#edf4fc" />
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <rect x="64" y="86" width="896" height="896" rx="208" fill="#010714" filter="url(#tile-ambient-shadow)" />

  <!-- 3D Base Thickness / Extrusion Lip -->
  <rect x="64" y="84" width="896" height="896" rx="208" fill="url(#extrusion-grad)" />

  <!-- Main Icon Squircle Tile -->
  <g id="icon-tile">
    <!-- Gradient Blueish Surface -->
    <rect x="64" y="56" width="896" height="896" rx="208" fill="url(#surface-blue)" />

    <!-- Dark Edges (Vignette) -->
    <rect x="64" y="56" width="896" height="896" rx="208" fill="url(#dark-edges-vignette)" />

    <!-- Directional Light Angle Sheen -->
    <rect x="64" y="56" width="896" height="896" rx="208" fill="url(#light-angle-sheen)" />

    <!-- Top-left Light Strike -->
    <rect x="64" y="56" width="896" height="896" rx="208" fill="url(#light-strike)" />

    <!-- Curved Glossy Glass Sheen across Upper Tile -->
    <path d="M 64 264 C 64 149 157 56 272 56 L 752 56 C 867 56 960 149 960 264 L 960 410 C 825 470 625 510 480 480 C 315 445 180 380 64 420 Z"
          fill="url(#glass-specular)" />

    <!-- Specular Micro-Highlight on Top Edge -->
    <path d="M 160 58 L 864 58" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

    <!-- 3D Beveled Glass Perimeter Border -->
    <rect x="64" y="56" width="896" height="896" rx="208" fill="none" stroke="url(#bevel-stroke)" stroke-width="3" />
  </g>

  <!-- 3D Floating White R with Dot Inside -->
  <g id="brand-glyph" filter="url(#glyph-depth)">
    <!-- White R Path -->
    <path fill="url(#white-glyph)" fill-rule="evenodd"
          d="M297 252H542C647 252 717 322 717 417C717 492 672 547 607 570L727 756H589L482 584H419V756H297ZM419 354V484H532C577 484 599 457 599 419C599 381 577 354 532 354Z" />

    <!-- Prominent, clearly visible white dot inside the upper loop of the R -->
    <circle cx="506" cy="419" r="34" fill="url(#white-glyph)" />
  </g>
</svg>
