name: Rust

on:
  push:
    branches: [ "claude/rema-foundation-setup-6gmim3" ]
  pull_request:
    branches: [ "claude/rema-foundation-setup-6gmim3" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Frontend. The pnpm version comes from "packageManager" in package.json.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile
    - name: Lint frontend
      run: pnpm lint
    - name: Typecheck frontend
      run: pnpm typecheck
    - name: Test frontend
      run: pnpm test
    # dist/ is embedded only by release builds (tauri build); the debug
    # cargo build below uses devUrl and does not need it.
    - name: Build frontend
      run: pnpm build

    # Rust app in src-tauri/. Tauri links WebKitGTK, GTK 3, libsoup 3 and
    # D-Bus (tao); reqwest links OpenSSL; the system tray ("Run ReMa in
    # background") uses Ayatana AppIndicator. No test uses the OS keychain.
    - name: Install Tauri system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config libssl-dev libdbus-1-dev \
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
          libayatana-appindicator3-dev
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    - name: Check formatting
      working-directory: src-tauri
      run: cargo fmt --check
    - name: Clippy
      working-directory: src-tauri
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Build
      working-directory: src-tauri
      run: cargo build --locked
    # Includes the check that src/generated/bindings.ts is up to date.
    - name: Run tests
      working-directory: src-tauri
      run: cargo test --locked
